<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>שותף לתפקיד</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Assistant:wght@300;400;500;600&display=swap');

:root{
  --paper:#F3EFE4;
  --card:#FBF9F3;
  --ink:#211E19;
  --pencil:#8B8577;
  --red:#A63D2F;
  --red-bg:#F3E2DD;
  --sage:#54614A;
  --sage-bg:#E7EADD;
  --line:#D8D2C2;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Assistant',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));}
button{touch-action:manipulation}

header{margin-bottom:24px;}
.slug{font-family:'Courier Prime',monospace;font-size:11px;color:var(--pencil);letter-spacing:0.5px;margin-bottom:6px;}
header h1{font-family:'Courier Prime',monospace;font-weight:700;font-size:22px;margin:0;letter-spacing:-0.2px;}
.rule{height:1px;background:var(--line);margin:14px 0 0;border:none;}

.screen{display:none}
.screen.active{display:block}

label{display:block;font-size:13px;color:var(--pencil);margin:20px 0 8px;font-weight:500}
label:first-of-type{margin-top:18px}
textarea{
  width:100%;min-height:190px;padding:14px;font-family:'Courier Prime',monospace;font-size:16px;line-height:1.7;
  border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);resize:vertical;
}
textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.hint{font-size:12px;color:var(--pencil);margin-top:8px;line-height:1.6}
.example{
  background:none;border:none;padding:0;font-size:13px;color:var(--red);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;font-family:'Assistant',sans-serif;margin-top:10px;display:inline-block;
}
button.primary{
  width:100%;padding:15px;font-family:'Assistant',sans-serif;font-size:15px;font-weight:600;
  background:var(--ink);color:var(--paper);border:none;border-radius:4px;cursor:pointer;margin-top:26px;
  letter-spacing:0.2px;
}
button.primary:disabled{opacity:.4;cursor:default}
button.secondary{
  width:100%;padding:13px;font-family:'Assistant',sans-serif;font-size:14px;font-weight:500;
  background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;cursor:pointer;margin-top:10px;
}
.err{color:var(--red);font-size:13px;margin-top:10px}

.rolecard{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border:1px solid var(--line);border-radius:4px;background:var(--card);margin-bottom:10px;cursor:pointer;
}
.rolecard.chosen{border-color:var(--ink);border-width:2px;background:var(--red-bg)}
.rolecard .name{font-family:'Courier Prime',monospace;font-weight:700;font-size:15px}
.rolecard .count{font-size:12px;color:var(--pencil)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.topbar .back{font-size:13px;color:var(--pencil);background:none;border:none;cursor:pointer;font-family:'Assistant',sans-serif;padding:0}
.topbar .role{font-family:'Courier Prime',monospace;font-size:12px;color:var(--pencil)}
.progress{height:2px;background:var(--line);margin-bottom:20px;}
.progress-fill{height:100%;background:var(--red);transition:width .3s}

#screen-rehearse.active{display:flex;flex-direction:column;height:calc(100dvh - 130px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:360px}
.feed{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 2px}
.line{padding:10px 4px;font-family:'Courier Prime',monospace;font-size:16px;line-height:1.65;border-bottom:1px dotted var(--line)}
.line:last-child{border-bottom:none}
.line .who{display:block;font-weight:700;font-size:12px;letter-spacing:1px;margin-bottom:3px;}
.line.other .who{color:var(--ink)}
.line.mine .who{color:var(--red)}
.line.mine{background:var(--sage-bg);border-radius:3px;padding:10px 10px;border-bottom:none;}
.line.dim{opacity:.3}
.line.speaking{background:var(--red-bg);border-radius:3px;padding:10px 10px;border-bottom:none;}

.status{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--pencil);margin-bottom:16px;min-height:20px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex-shrink:0}
.dot.wait{background:var(--red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.breathing{display:inline-flex;gap:3px}
.breathing span{width:4px;height:4px;border-radius:50%;background:var(--red);animation:bounce 1.2s infinite}
.breathing span:nth-child(2){animation-delay:.15s}
.breathing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.25}30%{opacity:1}}

.controls{display:flex;gap:8px}
.controls button{flex:1;margin-top:0;min-height:52px}
.rolecard{min-height:52px}

.donebox{text-align:center;padding:34px 10px}
.donebox .slug{justify-content:center;display:block}
.donebox h2{font-family:'Courier Prime',monospace;font-size:20px;margin:6px 0 8px}
.donebox p{color:var(--pencil);font-size:14px;margin:0 0 22px}

.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
#meterFill{height:100%;width:0;background:var(--pencil);transition:width .08s}
#meterFill.talking{background:var(--sage)}
.notice{
  border-right:2px solid var(--red);background:var(--card);border-radius:0 4px 4px 0;padding:9px 12px;font-size:12px;color:var(--ink);margin-bottom:16px;line-height:1.5;
}
</style>
</head>
<body>

<div class="wrap">
<header>
<div class="slug">אימפרו · מאגר תסריטים</div>
<h1>שותף לתפקיד</h1>
<hr class="rule">
</header>

<!-- SCREEN 1: INPUT -->
<div class="screen active" id="screen-input">
<label for="scriptInput">הדביקו את הסצנה</label>
<textarea id="scriptInput" placeholder="דני: את לא חייבת להישאר.&#10;נועה: אני יודעת. אני פה כי אני רוצה.&#10;דני: זה לא מה שאמרת אתמול."></textarea>
<div class="hint">כל שורה: שם הדמות, נקודתיים, ואז הטקסט.</div>
<button class="example" id="loadExample">טען דוגמה</button>
<div id="inputErr" class="err" style="display:none"></div>
<button class="primary" id="analyzeBtn">המשך לבחירת תפקיד</button>
</div>

<!-- SCREEN 2: ROLE PICK -->
<div class="screen" id="screen-roles">
<label>איזה תפקיד אתם משחקים?</label>
<div id="roleList"></div>
<button class="primary" id="startBtn">התחל תרגול</button>
<button class="secondary" id="backToInput">חזרה לעריכת הסצנה</button>
</div>

<!-- SCREEN 3: REHEARSE -->
<div class="screen" id="screen-rehearse">
<div class="topbar">
<button class="back" id="exitBtn">← יציאה</button>
<span class="role" id="roleLabel"></span>
</div>
<div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div id="micNotice" class="notice" style="display:none">האזנה למיקרופון פעילה — המערכת מזהה אוטומטית מתי סיימתם לדבר.</div>
<div class="feed" id="feed"></div>
<div class="status"><span class="dot" id="statusDot"></span><span id="statusText">מוכן</span></div>
<div id="liveTranscript" class="meter"><div id="meterFill"></div></div>
<div class="controls">
<button class="primary" id="actionBtn">התחל</button>
</div>
</div>

<!-- SCREEN 4: DONE -->
<div class="screen" id="screen-done">
<div class="donebox">
<div class="slug">— סוף הסצנה —</div>
<h2>זהו, לתיאבון</h2>
<p>אפשר לתרגל שוב, או להביא סצנה חדשה</p>
<button class="primary" id="againBtn">תרגל שוב מההתחלה</button>
<button class="secondary" id="newSceneBtn">סצנה חדשה</button>
</div>
</div>

</div>

<script>
const screens = {
  input: document.getElementById('screen-input'),
  roles: document.getElementById('screen-roles'),
  rehearse: document.getElementById('screen-rehearse'),
  done: document.getElementById('screen-done'),
};
function show(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const scriptInput = document.getElementById('scriptInput');
// Keep the pasted scene on the phone so a reload / tab switch doesn't lose it
try{ const saved = localStorage.getItem('sp_script'); if(saved) scriptInput.value = saved; }catch(e){}
scriptInput.addEventListener('input', () => {
  try{ localStorage.setItem('sp_script', scriptInput.value); }catch(e){}
});
document.getElementById('loadExample').onclick = () => {
  scriptInput.value = "דני: את לא חייבת להישאר.\nנועה: אני יודעת. אני פה כי אני רוצה.\nדני: זה לא מה שאמרת אתמול.\nנועה: אתמול פחדתי. היום פחות.\nדני: ומה השתנה?\nנועה: את שאלת.";
  try{ localStorage.setItem('sp_script', scriptInput.value); }catch(e){}
};

let parsedLines = [];
let characters = [];
let myCharacter = null;

function parseScript(raw){
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const result = [];
  for(const l of lines){
    // Lines that are only a stage direction, e.g. "(נכנסת לחדר)" — skip
    if(/^[\(\[].*[\)\]]$/.test(l)) continue;
    const idx = l.indexOf(':');
    const character = idx > -1 ? l.slice(0, idx).trim() : '';
    const text = idx > -1 ? l.slice(idx+1).trim() : l;
    if(idx > -1 && character && character.length <= 25 && text){
      result.push({character, text});
    } else if(result.length){
      // Wrapped line (common when pasting on a phone) — glue to the previous speech
      result[result.length-1].text += ' ' + l;
    } else {
      return null;
    }
  }
  return result;
}

document.getElementById('analyzeBtn').onclick = () => {
  const raw = scriptInput.value;
  const errBox = document.getElementById('inputErr');
  if(!raw.trim()){
    errBox.textContent = "צריך להדביק טקסט קודם";
    errBox.style.display = 'block';
    return;
  }
  const parsed = parseScript(raw);
  if(!parsed || parsed.length === 0){
    errBox.textContent = "לא זיהיתי מבנה של 'שם: משפט' בכל שורה.";
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';
  parsedLines = parsed;
  characters = [...new Set(parsed.map(l=>l.character))];
  renderRoles();
  show('roles');
};

function renderRoles(){
  const roleList = document.getElementById('roleList');
  roleList.innerHTML = '';
  myCharacter = null;
  characters.forEach(name=>{
    const count = parsedLines.filter(l=>l.character===name).length;
    const card = document.createElement('div');
    card.className = 'rolecard';
    card.innerHTML = `<span class="name">${esc(name)}</span><span class="count">${count} שורות</span>`;
    card.onclick = () => {
      document.querySelectorAll('.rolecard').forEach(c=>c.classList.remove('chosen'));
      card.classList.add('chosen');
      myCharacter = name;
    };
    roleList.appendChild(card);
  });
}

document.getElementById('backToInput').onclick = () => show('input');

document.getElementById('startBtn').onclick = () => {
  if(!myCharacter){
    const rl = document.getElementById('roleList');
    rl.scrollIntoView({behavior:'smooth', block:'center'});
    rl.style.outline = '2px solid var(--red)';
    setTimeout(()=>{ rl.style.outline=''; }, 1200);
    return;
  }
  document.getElementById('roleLabel').textContent = myCharacter.toUpperCase();
  setupRehearsal();
  show('rehearse');
};

/* ---- Voice output ---- */
let heVoices = [];
let voiceByCharacter = {};

function initVoices(){
  if(!('speechSynthesis' in window)) return;
  const pick = () => {
    const voices = window.speechSynthesis.getVoices();
    heVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('he'));
  };
  window.speechSynthesis.onvoiceschanged = pick;
  pick();
}
initVoices();

function assignVoices(){
  voiceByCharacter = {};
  if(heVoices.length === 0 && 'speechSynthesis' in window){
    heVoices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('he'));
  }
  const others = characters.filter(c => c !== myCharacter);
  others.forEach((name, i) => {
    if(heVoices.length > 0){
      voiceByCharacter[name] = heVoices[i % heVoices.length];
    }
  });
}

// Phones (iOS especially) only allow speech that was first started by a tap.
// Called from the "התחל" tap to unlock audio for the rest of the scene.
function unlockSpeech(){
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance('.');
    u.volume = 0;
    u.lang = 'he-IL';
    window.speechSynthesis.speak(u);
    setTimeout(() => { try{ if(!currentUtterance) window.speechSynthesis.cancel(); }catch(e){} }, 250);
  }catch(e){}
}

let currentUtterance = null; // global ref: Android Chrome garbage-collects utterances and never fires onend
function speak(text, character, cb){
  if(!('speechSynthesis' in window)){ cb(); return; }
  const synth = window.speechSynthesis;
  let done = false;
  let watchdog = null;
  const finish = () => {
    if(done) return;
    done = true;
    if(watchdog) clearTimeout(watchdog);
    currentUtterance = null;
    cb();
  };
  const u = new SpeechSynthesisUtterance(text);
  const v = voiceByCharacter[character];
  if(v) u.voice = v;
  u.lang = 'he-IL';
  u.rate = 0.95;
  u.onend = finish;
  u.onerror = finish;
  currentUtterance = u;
  const go = () => {
    if(synth.paused) synth.resume();
    // Safety net: if the phone never reports "finished", move on anyway
    watchdog = setTimeout(finish, 3000 + text.length * 200);
    synth.speak(u);
  };
  // Something stuck in the queue blocks new lines on Android: clear it, then speak after a short gap
  if(synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 120); }
  else go();
}

/* ---- Voice input: detect when you start and stop talking by mic volume ----
   No speech recognition, so no "beep" each time and works the same in any language.
   The mic is opened once per scene and kept open. */
let micAvailable = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let micStream = null, audioCtx = null, analyser = null, levelBuf = null;
let recog = null; // current listener for this turn

async function openMic(){
  if(micStream) return true;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    levelBuf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    return true;
  }catch(e){
    closeMic();
    return false;
  }
}
function closeMic(){
  try{ if(micStream) micStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(audioCtx) audioCtx.close(); }catch(e){}
  micStream = null; audioCtx = null; analyser = null;
}
function micLevel(){
  if(!analyser) return 0;
  analyser.getFloatTimeDomainData(levelBuf);
  let sum = 0;
  for(let i=0;i<levelBuf.length;i++) sum += levelBuf[i]*levelBuf[i];
  return Math.sqrt(sum/levelBuf.length);
}

// Listens for one line. Calls onDone() when you've spoken and then gone quiet.
function listenForLine(expectedLine, onDone, onLevel){
  const words = (expectedLine||'').trim().split(/\s+/).filter(Boolean).length;
  const TICK = 50;
  const MIN_SPEECH_MS = 250;                       // ignore coughs / clicks
  const EXPECTED_MS = Math.max(words * 250, 600);   // roughly how long the line takes at a fast pace
  const END_SILENCE_MS = words <= 6 ? 1300 : words <= 14 ? 1500 : 1700;
  const MIDLINE_SILENCE_MS = 3000;                  // a dramatic pause in the middle of a long line
  let floor = 0, calib = 0, calibN = 0;
  let speechMs = 0, silenceMs = 0, talkedMs = 0, started = false, finished = false;
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  const timer = setInterval(() => {
    if(finished) return;
    const lvl = micLevel();
    // First ~300ms: measure the room's background noise
    if(calibN < 6){ calib += lvl; calibN++; floor = calib/calibN; return; }
    const threshold = Math.max(0.018, floor * 2.5);
    if(onLevel) onLevel(Math.min(1, lvl / (threshold*3)), lvl > threshold);
    if(lvl > threshold){
      speechMs += TICK; silenceMs = 0;
      if(speechMs >= MIN_SPEECH_MS) started = true;
    } else {
      if(!started){ speechMs = Math.max(0, speechMs - TICK); floor = floor*0.97 + lvl*0.03; }
      else silenceMs += TICK;
    }
    if(started) talkedMs += TICK;
    const needSilence = talkedMs < EXPECTED_MS ? MIDLINE_SILENCE_MS : END_SILENCE_MS;
    if(started && silenceMs >= needSilence){
      finished = true; clearInterval(timer); onDone();
    }
  }, TICK);

  return { abort: () => { finished = true; clearInterval(timer); } };
}

function setMeter(lvl, talking){
  const f = document.getElementById('meterFill');
  f.style.width = Math.round(lvl*100) + '%';
  f.className = talking ? 'talking' : '';
}

/* ---- Keep the screen on during a scene ---- */
let wakeLock = null;
async function keepScreenOn(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){}
}
function allowScreenOff(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && sceneRunning) keepScreenOn();
});

/* ---- Rehearsal engine ---- */
let cursor = 0;
let runId = 0;          // bumps on exit/restart so callbacks from an old run do nothing
let sceneRunning = false;

function stopEverything(){
  runId++;
  sceneRunning = false;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(recog){ try{ recog.abort(); }catch(e){} recog = null; }
  closeMic();
  allowScreenOff();
  setMeter(0, false);
}

function setupRehearsal(){
  stopEverything();
  cursor = 0;
  assignVoices();
  document.getElementById('feed').innerHTML = '';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('actionBtn').textContent = 'התחל';
  document.getElementById('actionBtn').style.display = 'block';
  document.getElementById('actionBtn').onclick = beginScene;
  document.getElementById('actionBtn').disabled = false;
  const notice = document.getElementById('micNotice');
  notice.style.display = 'block';
  notice.textContent = micAvailable
    ? 'המיקרופון נפתח פעם אחת בתחילת הסצנה. כשתסיים משפט ותשתוק רגע — הסצנה ממשיכה לבד.'
    : 'אין גישה למיקרופון בדפדפן הזה — בתור שלך לחץ "סיימתי — הבא".';
  setStatus('מוכן להתחיל', false);
}

function setStatus(html, waiting){
  document.getElementById('statusText').innerHTML = html;
  document.getElementById('statusDot').className = 'dot' + (waiting ? ' wait' : '');
}

function updateProgress(){
  const pct = Math.round((cursor / parsedLines.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

function addLineToFeed(line, isMine){
  const div = document.createElement('div');
  div.className = 'line ' + (isMine ? 'mine' : 'other');
  div.innerHTML = `<span class="who">${esc(line.character)}</span>${esc(line.text)}`;
  const feed = document.getElementById('feed');
  feed.appendChild(div);
  // Scroll only the script box, not the whole page (scrollIntoView jumps the page on phones)
  feed.scrollTo({top: feed.scrollHeight, behavior:'smooth'});
  return div;
}

async function beginScene(){
  const btn = document.getElementById('actionBtn');
  btn.onclick = null;
  btn.disabled = true;
  unlockSpeech();   // must happen inside the tap
  keepScreenOn();
  const myRun = runId;
  if(micAvailable){
    setStatus('פותח מיקרופון…', true);
    const ok = await openMic();
    if(myRun !== runId) { closeMic(); return; }
    if(!ok){
      document.getElementById('micNotice').textContent = 'אין אישור למיקרופון — בתור שלך לחץ "סיימתי — הבא". (אפשר לאשר בהגדרות האתר בדפדפן)';
    }
  }
  sceneRunning = true;
  advance(myRun);
}

function advance(myRun){
  if(myRun !== runId) return;            // scene was exited/restarted
  if(cursor >= parsedLines.length){ finishScene(); return; }
  const line = parsedLines[cursor];
  updateProgress();

  if(line.character === myCharacter){
    const el = addLineToFeed(line, true);
    const btn = document.getElementById('actionBtn');

    const goNext = () => {
      if(recog){ recog.abort(); recog = null; }
      setMeter(0, false);
      btn.disabled = true;
      cursor++;
      setTimeout(() => advance(myRun), 200);
    };
    btn.style.display = 'block';
    btn.textContent = 'סיימתי — הבא';
    btn.disabled = false;
    btn.onclick = goNext;

    if(micStream){
      setStatus('התור שלך — דבר, וכשתסיים זה ימשיך לבד', true);
      recog = listenForLine(line.text, () => {
        if(myRun !== runId) return;
        recog = null;
        goNext();
      }, (lvl, talking) => setMeter(lvl, talking));
    } else {
      setStatus('התור שלך — לחץ כשסיימת', true);
    }
  } else {
    const el = addLineToFeed(line, false);
    el.classList.add('speaking');
    document.getElementById('actionBtn').style.display = 'none';
    setStatus(line.character.toUpperCase() + ' מדבר…', false);
    speak(line.text, line.character, () => {
      if(myRun !== runId) return;
      el.classList.remove('speaking');
      cursor++;
      updateProgress();
      setTimeout(() => advance(myRun), 300);
    });
  }
}

function finishScene(){
  sceneRunning = false;
  closeMic();
  allowScreenOff();
  document.getElementById('progressFill').style.width = '100%';
  setStatus('הסתיים', false);
  show('done');
}

document.getElementById('exitBtn').onclick = () => {
  stopEverything();
  show('roles');
};
document.getElementById('againBtn').onclick = () => { setupRehearsal(); show('rehearse'); };
document.getElementById('newSceneBtn').onclick = () => {
  scriptInput.value='';
  try{ localStorage.removeItem('sp_script'); }catch(e){}
  show('input');
};
</script>
</body>
